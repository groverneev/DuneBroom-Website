<rect x="451" y="48" width="570" height="92" rx="46" stroke-width="4" class="dg-f-purple-f dg-s-purple-s">
</rect>
<text x="736" y="103" font-weight="bold" font-size="30" textLength="209.2" lengthAdjust="spacingAndGlyphs">Start survey</text>
<rect x="365" y="189" width="742" height="98" rx="3" stroke-width="4" class="dg-f-green-f dg-s-green-s">
</rect>
<text x="736" y="230.5" textLength="229.4" lengthAdjust="spacingAndGlyphs">Load calibration</text>
<text x="736" y="263" textLength="505.4" lengthAdjust="spacingAndGlyphs">(image ground area, pixels per cm)</text>
<rect x="365" y="336" width="742" height="98" rx="3" stroke-width="4" class="dg-f-green-f dg-s-green-s">
</rect>
<text x="736" y="377.5" textLength="456.8" lengthAdjust="spacingAndGlyphs">Rover drives forward along lane</text>
<text x="736" y="410" textLength="336.6" lengthAdjust="spacingAndGlyphs">(Arduino motor control)</text>
<rect x="365" y="483" width="742" height="98" rx="3" stroke-width="4" class="dg-f-green-f dg-s-green-s">
</rect>
<text x="736" y="541" textLength="562.1" lengthAdjust="spacingAndGlyphs">Capture image from downward camera</text>
<rect x="365" y="630" width="742" height="98" rx="3" stroke-width="4" class="dg-f-green-f dg-s-green-s">
</rect>
<text x="736" y="671.5" textLength="545.7" lengthAdjust="spacingAndGlyphs">Measure ground shift since last image</text>
<text x="736" y="704" textLength="396.8" lengthAdjust="spacingAndGlyphs">(OpenCV phase correlation)</text>
<rect x="365" y="777" width="742" height="98" rx="3" stroke-width="4" class="dg-f-green-f dg-s-green-s">
</rect>
<text x="736" y="835" textLength="481.7" lengthAdjust="spacingAndGlyphs">Detect debris with YOLOv8 model</text>
<rect x="365" y="924" width="742" height="98" rx="3" stroke-width="4" class="dg-f-green-f dg-s-green-s">
</rect>
<text x="736" y="965.5" textLength="707.5" lengthAdjust="spacingAndGlyphs">Keep only detections centered in the new-ground</text>
<text x="736" y="998" textLength="676.9" lengthAdjust="spacingAndGlyphs">strip and lane band (prevents double counting)</text>
<rect x="365" y="1071" width="742" height="98" rx="3" stroke-width="4" class="dg-f-green-f dg-s-green-s">
</rect>
<text x="736" y="1112.5" textLength="569.3" lengthAdjust="spacingAndGlyphs">Log each new item: size, type, position;</text>
<text x="736" y="1145" textLength="447.5" lengthAdjust="spacingAndGlyphs">add new strip to surveyed area</text>
<rect x="365" y="1586" width="742" height="98" rx="3" stroke-width="4" class="dg-f-green-f dg-s-green-s">
</rect>
<text x="736" y="1627.5" textLength="510.2" lengthAdjust="spacingAndGlyphs">Calculate density = unique items ÷</text>
<text x="736" y="1660" textLength="365.3" lengthAdjust="spacingAndGlyphs">surveyed area (items/m²)</text>
<rect x="365" y="1733" width="742" height="98" rx="3" stroke-width="4" class="dg-f-green-f dg-s-green-s">
</rect>
<text x="736" y="1791" textLength="587.6" lengthAdjust="spacingAndGlyphs">Save counts, density, and detection map</text>
<rect x="451" y="1886" width="570" height="92" rx="46" stroke-width="4" class="dg-f-purple-f dg-s-purple-s">
</rect>
<text x="736" y="1941" font-weight="bold" font-size="30" textLength="187.2" lengthAdjust="spacingAndGlyphs">End survey</text>
<path d="M461 1297L736 1224L1011 1297L736 1370Z" stroke-width="4" stroke-linejoin="miter" class="dg-f-amber-f dg-s-amber-s">
</path>
<text x="736" y="1306.5" textLength="227.4" lengthAdjust="spacingAndGlyphs">Lane complete?</text>
<path d="M462 1483L736 1412L1010 1483L736 1554Z" stroke-width="4" stroke-linejoin="miter" class="dg-f-amber-f dg-s-amber-s">
</path>
